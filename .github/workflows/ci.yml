# CI — Phase 00 (DEC-0018 / CR-0001)
# الفحوصات المفعّلة: CI-002, CI-009, CI-010, CI-011, CI-018
# أسماء الـjobs ثابتة (عقد مع branch protection — ci/00-ci-policy.md).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # CI-018 + ADR-0001: إصدار Flutter مثبت (يجب أن يطابق .fvmrc — لا latest).
  PINNED_FLUTTER_VERSION: '3.47.5'

jobs:
  asset-scan:
    name: asset-scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter (pinned)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: 'CI-018: Flutter version pinned'
        shell: bash
        run: |
          set -euo pipefail
          INSTALLED=$(flutter --version 2>/dev/null | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          PINNED=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' .fvmrc | head -n 1)
          echo "installed=$INSTALLED pinned=$PINNED workflow=$PINNED_FLUTTER_VERSION"
          if [ "$INSTALLED" != "$PINNED" ] || [ "$PINNED" != "$PINNED_FLUTTER_VERSION" ]; then
            echo 'CI-018 FAIL: version mismatch'
            exit 1
          fi
          echo 'CI-018 OK'

      - name: 'CI-002 Asset scan'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f legal/assets.yaml ]; then
            echo 'CI-002 FAIL: legal/assets.yaml not found'
            exit 1
          fi

          # Extract all registered paths from legal/assets.yaml
          REGISTERED=$(grep -oP 'path:\s*"\K[^"]+' legal/assets.yaml || true)

          # Find all real asset files (excluding .gitkeep)
          UNREGISTERED=""
          while IFS= read -r file; do
            rel="${file#./}"

            if ! echo "$REGISTERED" | grep -qxF "$rel"; then
              UNREGISTERED="${UNREGISTERED}${rel}"$'\n'
            fi
          done < <(find assets -type f ! -name '.gitkeep')

          if [ -n "$UNREGISTERED" ]; then
            echo 'CI-002 FAIL: assets not registered in legal/assets.yaml:'
            printf '%s' "$UNREGISTERED"
            echo ''
            echo 'Fix: add path: field to each asset entry in legal/assets.yaml'
            exit 1
          fi

          COUNT=$(printf '%s\n' "$REGISTERED" | grep -c '^assets/' || echo 0)
          echo "CI-002 OK: $COUNT registered asset file(s)"

  analyze:
    name: analyze
    needs: asset-scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter (pinned)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: 'CI-018: Flutter version pinned'
        shell: bash
        run: |
          set -euo pipefail
          INSTALLED=$(flutter --version 2>/dev/null | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          PINNED=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' .fvmrc | head -n 1)
          if [ "$INSTALLED" != "$PINNED" ] || [ "$PINNED" != "$PINNED_FLUTTER_VERSION" ]; then
            echo "CI-018 FAIL: installed=$INSTALLED pinned=$PINNED"
            exit 1
          fi
          echo 'CI-018 OK'

      - name: Get dependencies (enforce lockfile)
        run: flutter pub get --enforce-lockfile

      - name: 'CI-009: flutter analyze --fatal-infos'
        run: flutter analyze --fatal-infos

  test:
    name: test
    needs: analyze
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter (pinned)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: 'CI-018: Flutter version pinned'
        shell: bash
        run: |
          set -euo pipefail
          INSTALLED=$(flutter --version 2>/dev/null | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          PINNED=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' .fvmrc | head -n 1)
          if [ "$INSTALLED" != "$PINNED" ] || [ "$PINNED" != "$PINNED_FLUTTER_VERSION" ]; then
            echo "CI-018 FAIL: installed=$INSTALLED pinned=$PINNED"
            exit 1
          fi
          echo 'CI-018 OK'

      - name: Get dependencies (enforce lockfile)
        run: flutter pub get --enforce-lockfile

      - name: 'CI-010: flutter test'
        run: flutter test

  build-debug:
    name: build-debug
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter (pinned)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: 'CI-018: Flutter version pinned'
        shell: bash
        run: |
          set -euo pipefail
          INSTALLED=$(flutter --version 2>/dev/null | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          PINNED=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' .fvmrc | head -n 1)
          if [ "$INSTALLED" != "$PINNED" ] || [ "$PINNED" != "$PINNED_FLUTTER_VERSION" ]; then
            echo "CI-018 FAIL: installed=$INSTALLED pinned=$PINNED"
            exit 1
          fi
          echo 'CI-018 OK'

      - name: Get dependencies (enforce lockfile)
        run: flutter pub get --enforce-lockfile

      - name: Free disk space (CI #84-89: No space left on device)
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: 'CI-011: flutter build apk --debug'
        run: flutter build apk --debug

  # ===== Phase 00B — تفعيل CI-012/014/015/016/017 (2026-10-06) =====
  # كل job: CI الإجمالي يُحسب فاشلاً إذا فشل أي منها.
  check-test-count:
    name: check-test-count
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter (pinned)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: 'CI-018: Flutter version pinned'
        shell: bash
        run: |
          set -euo pipefail
          INSTALLED=$(flutter --version 2>/dev/null | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          PINNED=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' .fvmrc | head -n 1)
          if [ "$INSTALLED" != "$PINNED" ]; then
            echo "CI-018 FAIL: installed=$INSTALLED pinned=$PINNED"
            exit 1
          fi
          echo 'CI-018 OK'

      - name: Get dependencies (enforce lockfile)
        run: flutter pub get --enforce-lockfile

      - name: 'CI-012: tests not reduced'
        shell: bash
        run: |
          chmod +x tool/*.sh
          tool/check_test_count.sh

  check-no-print:
    name: check-no-print
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'CI-018: Flutter version pinned (static)'
        shell: bash
        run: |
          set -euo pipefail
          FVM=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' .fvmrc | head -n 1)
          WF=$(grep -oE "flutter-version: '[0-9]+\.[0-9]+\.[0-9]+'" .github/workflows/ci.yml | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$FVM" != "$WF" ]; then echo "CI-018 FAIL: fvmrc=$FVM workflow=$WF"; exit 1; fi
          echo "CI-018 OK (static): $FVM"

      - name: 'CI-014: no print / no undocumented ignore'
        shell: bash
        run: |
          chmod +x tool/*.sh
          tool/check_no_print.sh

  check-no-internet:
    name: check-no-internet
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'CI-018: Flutter version pinned (static)'
        shell: bash
        run: |
          set -euo pipefail
          FVM=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' .fvmrc | head -n 1)
          WF=$(grep -oE "flutter-version: '[0-9]+\.[0-9]+\.[0-9]+'" .github/workflows/ci.yml | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$FVM" != "$WF" ]; then echo "CI-018 FAIL: fvmrc=$FVM workflow=$WF"; exit 1; fi
          echo "CI-018 OK (static): $FVM"

      - name: 'CI-015: no INTERNET in main manifest'
        shell: bash
        run: |
          chmod +x tool/*.sh
          tool/check_no_internet.sh

  check-no-network-pkg:
    name: check-no-network-pkg
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'CI-018: Flutter version pinned (static)'
        shell: bash
        run: |
          set -euo pipefail
          FVM=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' .fvmrc | head -n 1)
          WF=$(grep -oE "flutter-version: '[0-9]+\.[0-9]+\.[0-9]+'" .github/workflows/ci.yml | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$FVM" != "$WF" ]; then echo "CI-018 FAIL: fvmrc=$FVM workflow=$WF"; exit 1; fi
          echo "CI-018 OK (static): $FVM"

      - name: 'CI-016: no network packages in pubspec'
        shell: bash
        run: |
          chmod +x tool/*.sh
          tool/check_no_network_pkg.sh

  check-no-placeholder:
    name: check-no-placeholder
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'CI-018: Flutter version pinned (static)'
        shell: bash
        run: |
          set -euo pipefail
          FVM=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' .fvmrc | head -n 1)
          WF=$(grep -oE "flutter-version: '[0-9]+\.[0-9]+\.[0-9]+'" .github/workflows/ci.yml | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$FVM" != "$WF" ]; then echo "CI-018 FAIL: fvmrc=$FVM workflow=$WF"; exit 1; fi
          echo "CI-018 OK (static): $FVM"

      - name: 'CI-017: no placeholder in main'
        shell: bash
        run: |
          chmod +x tool/*.sh
          tool/check_no_placeholder.sh
